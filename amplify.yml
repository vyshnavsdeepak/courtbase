version: 1
applications:
  - appRoot: apps/nextjs
    frontend:
      phases:
        preBuild:
          commands:
            - npm install -g pnpm
            - pnpm install
        build:
          commands:
            - pnpm exec turbo run build --filter=@court-base/nextjs
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - .next/cache/**/*
          - node_modules/**/*
    buildPath: apps/nextjs
version: 1
applications:
  - appRoot: apps/nextjs
    frontend:
      phases:
        preBuild:
          commands:
            - npm install -g pnpm
        build:
          commands:
            - pnpm install
            - echo "Current working directory:"
            - pwd
            - env >> .env.production
            - pnpm exec turbo run build --filter=@court-base/nextjs
            - pnpm run db:migrate:deploy
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - apps/nextjs/.next/cache/**/*
          - node_modules/**/*
    buildPath: apps/nextjs
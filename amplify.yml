version: 1
applications:
  - appRoot: apps/nextjs
    frontend:
      phases:
        preBuild:
          commands:
            - npm install -g pnpm
        build:
          commands:
            - pnpm install
            - pnpm exec turbo run build --filter=@court-base/nextjs
      artifacts:
        baseDirectory: apps/nextjs/.next
        files:
          - '**/*'
      cache:
        paths:
          - apps/nextjs/.next/cache/**/*
          - node_modules/**/*
    buildPath: apps/nextjs